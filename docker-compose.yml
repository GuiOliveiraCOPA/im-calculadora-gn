# Calculadora GLP x GN em contêiner, para desenvolvimento e teste local.
# Produção roda no Kubernetes (deploy/k8s/); este arquivo não é usado lá.
#
#   cp .env.example .env      (preencha host, http_path e credencial)
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose exec calculadora python scripts/testar_conexao.py
#   docker compose down

services:
  calculadora:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    image: calculadora-gn:latest
    container_name: calculadora-gn
    env_file: .env
    environment:
      HOST: 0.0.0.0              # dentro do contêiner, escuta em todas as interfaces
      PORTA: "5000"              # porta interna fixa; a do servidor é a do "ports" abaixo
    ports:
      - "${PORTA:-5000}:5000"
    restart: unless-stopped
