<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de disponibilidade de Gás Natural</title>
  <link rel="stylesheet" href="Arquivos do Mapa Brasil/Estilos do Mapa Brasil.css">
</head>
<body>
  <div class="map-return-bar">
    <a class="top-navigation-button" id="comgasMapButton" href="mapaconcessionarias.html" aria-label="Abrir os mapas oficiais das concessionárias">Mapas das concessionárias</a>
    <a class="back-to-calculator" href="../5_Calculadora_Final/index.html" aria-label="Voltar para a calculadora GLP x GN">Voltar para a calculadora</a>
  </div>

  <main>
    <span id="sourceStatus" hidden></span>
    <section class="content-grid">
      <article class="panel map-panel">
        <div class="panel-heading">
          <div>
            <h2>Mapa municipal</h2>
            <p>Espere alguns minutos até que a base seja carregada e clique em um município para ver os detalhes!</p>
          </div>
        </div>
        <div class="map-kpis" aria-label="Resumo de municípios">
          <button class="map-kpi-card total active" type="button" data-status-filter="" aria-pressed="true"><span>Total exibido</span><strong id="totalCount">—</strong></button>
          <button class="map-kpi-card attended" type="button" data-status-filter="Atendido" aria-pressed="false"><span>Atendidos</span><strong id="attendedCount">—</strong></button>
          <button class="map-kpi-card expansion" type="button" data-status-filter="Em expansão" aria-pressed="false"><span>Em expansão</span><strong id="expansionCount">—</strong></button>
          <button class="map-kpi-card unattended" type="button" data-status-filter="Não atendido" aria-pressed="false"><span>Não atendidos</span><strong id="unattendedCount">—</strong></button>
        </div>
        <div class="map-wrap" id="mapWrap">
          <div class="map-zoom-controls" aria-label="Controles de zoom do mapa">
            <button id="zoomIn" type="button" aria-label="Aumentar zoom">+</button>
            <button id="zoomOut" type="button" aria-label="Diminuir zoom">−</button>
          </div>
          <canvas id="mapCanvas" width="840" height="720" role="img" aria-label="Mapa dos municípios brasileiros"></canvas>
          <canvas id="hitCanvas" width="840" height="720" hidden></canvas>
          <div id="tooltip" class="tooltip" hidden></div>
          <div id="mapLoading" class="loading">Preparando os 5.570 municípios…</div>
        </div>
        <div class="legend" aria-label="Legenda">
          <span><i class="dot attended-bg"></i>Atendido</span>
          <span><i class="dot expansion-bg"></i>Em expansão</span>
          <span><i class="dot unattended-bg"></i>Não atendido</span>
        </div>
      </article>

      <aside class="panel detail-panel">
        <div class="panel-heading">
          <div>
            <h2>Municípios</h2>
            <p id="tableSummary">Carregando…</p>
          </div>
        </div>
        <section class="filters detail-filters" aria-label="Filtros">
          <label>
            <span>Região</span>
            <select id="regionSelect"><option value="">Todos</option></select>
          </label>
          <label>
            <span>UF</span>
            <select id="ufSelect"><option value="">Todos</option></select>
          </label>
          <label>
            <span>Mesorregião</span>
            <select id="mesoregionSelect"><option value="">Todos</option></select>
          </label>
          <label>
            <span>Município</span>
            <select id="municipalitySelect"><option value="">Todos</option></select>
          </label>
          <button id="clearFilters" class="clear-filter-button" type="button" aria-label="Limpar filtros" title="Limpar filtros"><svg class="clear-icon eraser-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 15.5 13.5 6a2.2 2.2 0 0 1 3.1 0l2.4 2.4a2.2 2.2 0 0 1 0 3.1L11.5 19H5.8L4 17.2a1.2 1.2 0 0 1 0-1.7Z"></path><path d="M10.5 8.9 16.1 14.5"></path><path d="M13 19h7"></path></svg></button>
        </section>
        <div class="selected-card" id="selectedCard" hidden>
          <button id="closeCard" type="button" aria-label="Fechar detalhes">×</button>
          <span id="selectedStatus" class="status-pill"></span>
          <h3 id="selectedCity"></h3>
          <p id="selectedConcession"></p>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Município</th><th>UF</th><th>Situação</th></tr></thead>
            <tbody id="municipalityRows"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button id="prevPage" type="button">Anterior</button>
          <span id="pageInfo"></span>
          <button id="nextPage" type="button">Próxima</button>
        </div>
      </aside>
    </section>
  </main>
  <script src="Arquivos do Mapa Brasil/Dados/municipios-gn.js"></script>
  <script src="Arquivos do Mapa Brasil/Dados/mapa-geometrias.js"></script>
  <script src="Arquivos do Mapa Brasil/Dados/mapa-lookup.js"></script>
  <script src="Arquivos do Mapa Brasil/Dados/mapa-estados.js"></script>
  <script src="Arquivos do Mapa Brasil/Funcionamento do Mapa Brasil.js"></script>
</body>
</html>
