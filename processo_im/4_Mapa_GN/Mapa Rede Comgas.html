<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rede Comgás — São Paulo</title>
  <link rel="stylesheet" href="Arquivos do Mapa SP/Biblioteca do Mapa/leaflet.css">
  <link rel="stylesheet" href="Arquivos do Mapa SP/Estilos do Mapa SP.css">
</head>
<body>
  <main class="network-page">
    <header class="network-toolbar">
      <div>
        <h1>Rede Comgás</h1>
        <p>São Paulo — ruas e rede oficial de distribuição</p>
      </div>
      <div class="network-actions" aria-label="Controles do mapa">
        <span class="network-location" aria-label="Localização do mapa">São Paulo</span>
        <button id="networkClose" type="button" aria-label="Voltar ao mapa do Brasil">Fechar</button>
      </div>
    </header>
    <div id="networkMap" role="application" aria-label="Mapa de ruas e Rede Comgás em São Paulo"></div>
  </main>
  <script src="Arquivos do Mapa SP/Biblioteca do Mapa/leaflet.js"></script>
  <script src="Arquivos do Mapa SP/Funcionamento do Mapa SP.js"></script>
</body>
</html>
